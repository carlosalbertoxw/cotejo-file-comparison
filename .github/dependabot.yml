# Actualizaciones de versión propuestas como pull request.
#
# Las alertas de seguridad ya llegaban solas, pero solo cubren lo que tiene un
# aviso publicado. Electron es el caso que lo justifica: viaja entero dentro de
# cada instalable, y sus parches traen correcciones de Chromium que no siempre
# salen como aviso de dependencia. Sin esto, la 0.5.0 se publico con 43.2.0
# cuando la rama ya iba por 43.7.5.
#
# Agrupado y semanal para que sean pocos PR y pequenos. Las versiones mayores
# se quedan fuera de los grupos: cada una merece su propio PR y su lectura de
# notas de cambios.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      parches-y-menores:
        update-types: [minor, patch]
    # Los tipos de Node siguen a la version que corre el proyecto (.nvmrc),
    # no a la ultima: con los de una mayor, el typecheck dejaria usar APIs que
    # Node 22 no tiene. Se suben a mano junto con .nvmrc.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 es el compilador nuevo y typescript-eslint todavia pide
      # `<6.1.0`: el PR ni siquiera pasa `npm ci`. Quitar cuando lo acepte.
      - dependency-name: typescript
        versions: ['>=7']
      # electron-vite 5 solo admite hasta Vite 7; el soporte de Vite 8 esta en
      # la 6, aun en beta. Quitar al subir a electron-vite 6.
      - dependency-name: vite
        versions: ['>=8']
      # La 6 del plugin de React pide Vite 8, que esta bloqueado por la misma
      # razon: `npm ci` falla con ERESOLVE. Quitar junto con la de vite.
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6']

  # El sitio es un proyecto npm aparte, con su propio lockfile.
  - package-ecosystem: npm
    directory: /sitio
    schedule:
      interval: weekly
    groups:
      parches-y-menores:
        update-types: [minor, patch]
    # Los tipos de Node siguen a la version que corre el proyecto (.nvmrc),
    # no a la ultima: con los de una mayor, el typecheck dejaria usar APIs que
    # Node 22 no tiene. Se suben a mano junto con .nvmrc.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @astrojs/check pide TypeScript 5 o 6. Quitar cuando acepte el 7.
      - dependency-name: typescript
        versions: ['>=7']

  # Las acciones van fijadas por SHA; Dependabot mueve el SHA y el comentario
  # con la version a la vez. Como en npm, solo se agrupan parches y menores:
  # la primera tanda metio ocho mayores en un solo PR, y varias de esas
  # acciones solo corren al publicar, donde el verde del PR no las ha probado.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
        update-types: [minor, patch]
