# Las pruebas E2E en macOS, una vez a la semana y a mano.
#
# El CI las corre en Linux y en Windows, y release.yml las salta en macOS para
# no estrenarlas en mitad de una publicacion. Con eso, los .dmg salian sin que
# nada hubiera arrancado nunca la aplicacion en un Mac. Esto lo hace aparte y
# sin bloquear nada: si falla, se ve aqui y no en el momento de publicar. Cuando
# lleve un tiempo en verde, toca quitar la excepcion de release.yml.
name: e2e-macos

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nada de este job hace `git push`: el token no tiene por que quedarse
          # en .git/config al alcance de los scripts de las dependencias.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # El mismo npm que en el CI, para que se aplique `allowScripts`.
      - run: npx --yes npm@11.16.0 ci

      - run: npm run build

      - run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-macos
          path: test-results/
          if-no-files-found: ignore
