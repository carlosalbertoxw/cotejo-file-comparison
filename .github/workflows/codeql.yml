# Analisis estatico de seguridad con CodeQL.
#
# Los tests comprueban que `safeJoin` y la validacion del IPC hacen lo que
# deben con los casos que alguien penso; CodeQL busca los que nadie penso:
# rutas del renderer que llegan al disco sin pasar por ellos, expresiones
# regulares que se atascan, HTML sin escapar. Tambien revisa los propios
# workflows: permisos de mas, acciones sin fijar, entradas que llegan a un
# `run` sin comillas.
#
# Los resultados salen en la pestana Security del repositorio, no como fallo
# del workflow: un aviso nuevo no bloquea el trabajo, pero queda a la vista.
name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - 'changelog/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'changelog/**'
      - '**/*.md'
  # Una vez a la semana aunque no haya cambios: las consultas de CodeQL
  # mejoran y pueden encontrar algo nuevo en codigo viejo.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Subir los resultados a la pestana Security.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` cubre la aplicacion y el sitio; `actions`,
        # los workflows de .github/.
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Sin compilar nada: CodeQL lee el TypeScript directamente.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Las consultas ampliadas de seguridad, no solo las de por defecto.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
