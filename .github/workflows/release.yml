# Construye los instalables de las tres plataformas y los publica en la release.
#
# macOS es el motivo de que esto exista: el .dmg no se puede generar desde
# Windows ni desde Linux, hace falta un runner macOS de verdad.
name: release

on:
  push:
    tags:
      - 'v*'
  # Permite probar el workflow sin publicar nada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Antes de construir nada: las notas de la version son obligatorias y el tag
  # tiene que cuadrar con package.json. Enterarse aqui cuesta diez segundos;
  # enterarse despues, tres empaquetados completos.
  notas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch corre sin tag, y ahi no hay nada que comprobar.
      - name: Comprobar las notas y la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notas="changelog/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notas" ]; then
            echo "Falta $notas. La release se publica con lo que haya en ese archivo:" >&2
            echo "renombra changelog/proxima.md antes de empujar el tag." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la version v$version de package.json." >&2
            echo "Con eso, el aviso de actualizacion de la aplicacion daria una version equivocada." >&2
            exit 1
          fi

  build:
    needs: notas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
            artifacts: |
              release/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - os: macos-latest
            script: package:mac
            artifacts: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Empaquetar
        run: npm run ${{ matrix.script }}
        env:
          # Sin certificado electron-builder avisa y sigue sin firmar, que es
          # justo lo que queremos mientras no haya cuenta de Apple Developer.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: cotejo-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # El checkout es solo para leer las notas de la version.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # El cuerpo de la release sale de changelog/, escrito a mano. Debajo,
      # GitHub anade sola la lista de commits y de contribuyentes.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body_path: changelog/${{ github.ref_name }}.md
          generate_release_notes: true
