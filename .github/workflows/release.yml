# Construye los instalables de las tres plataformas y los publica en la release.
#
# macOS es el motivo de que esto exista: el .dmg no se puede generar desde
# Windows ni desde Linux, hace falta un runner macOS de verdad.
name: release

on:
  push:
    tags:
      - 'v*'
  # Permite probar el workflow sin publicar nada.
  workflow_dispatch:

# Solo lectura por defecto. `build` ejecuta `npm ci` y los tests, es decir,
# codigo de cientos de paquetes de terceros: con el token de escritura, uno
# comprometido podria tocar el repositorio o cambiar los instalables de una
# release que se descarga sin firma. Escribir solo lo necesita `publish`.
permissions:
  contents: read

jobs:
  # Antes de construir nada: las notas de la version son obligatorias y el tag
  # tiene que cuadrar con package.json. Enterarse aqui cuesta diez segundos;
  # enterarse despues, tres empaquetados completos.
  notas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nada de este job hace `git push`: el token no tiene por que quedarse
          # en .git/config al alcance de los scripts de las dependencias.
          persist-credentials: false

      # workflow_dispatch corre sin tag, y ahi no hay nada que comprobar.
      - name: Comprobar las notas y la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notas="changelog/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notas" ]; then
            echo "Falta $notas. La release se publica con lo que haya en ese archivo:" >&2
            echo "renombra changelog/proxima.md antes de empujar el tag." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la version v$version de package.json." >&2
            echo "Con eso, el aviso de actualizacion de la aplicacion daria una version equivocada." >&2
            exit 1
          fi

  build:
    needs: notas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
            artifacts: |
              release/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.cdx.json
          - os: macos-latest
            script: package:mac
            artifacts: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # El mismo npm que en el CI, para que se aplique `allowScripts`.
      - run: npx --yes npm@11.16.0 ci

      # Lo mismo que exige el CI, por si el tag sale de un commit que no paso
      # por el. Los tipos no hace falta: `package` los comprueba al construir.
      # El audit va aqui y no solo en el CI porque un aviso publicado entre el
      # ultimo push y el tag tiene que parar los instalables.
      - name: Vulnerabilidades conocidas
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      - name: Empaquetar
        run: npm run ${{ matrix.script }}
        env:
          # Sin certificado electron-builder avisa y sigue sin firmar, que es
          # justo lo que queremos mientras no haya cuenta de Apple Developer.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # La E2E sobre lo que se acaba de construir (`package` deja el bundle en
      # out/), con el mismo arreglo del sandbox que en el CI. En macOS no: el
      # CI nunca la ha corrido ahi, y estrenarla en mitad de una release solo
      # anadiria una forma nueva de fallar.
      - name: Permitir el sandbox de Chromium
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pruebas E2E
        if: runner.os != 'macOS'
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e

      # Inventario de las versiones exactas que van dentro (SBOM CycloneDX):
      # ante un aviso sobre una dependencia o sobre un Electron concreto, dice
      # que releases publicadas estan afectadas sin tener que reconstruirlas.
      # Es el arbol completo del lockfile, herramientas de build incluidas,
      # porque Electron, React y CodeMirror estan en devDependencies y son
      # justo lo que se distribuye. El lockfile es el mismo en los tres
      # sistemas, asi que basta con uno. Viaja con los instalables: entra en
      # las sumas, en la atestacion y en la release.
      - name: SBOM
        if: runner.os == 'Linux'
        run: |
          version=$(node -p "require('./package.json').version")
          npm sbom --sbom-format cyclonedx --sbom-type application --package-lock-only \
            > "release/Cotejo-${version}-sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cotejo-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Crear la release, subir los archivos y firmar su procedencia. Este job no
    # instala ni ejecuta nada del proyecto, por eso es el unico con permisos.
    permissions:
      contents: write
      # Firmar sin claves propias: GitHub emite un certificado efimero ligado
      # a este workflow y a este commit.
      id-token: write
      attestations: write
    steps:
      # El checkout es solo para leer las notas de la version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Los instalables no van firmados. Esto no quita el aviso de SmartScreen
      # ni el de Gatekeeper, pero deja comprobar que lo descargado es lo que
      # construyo este workflow: las sumas, que el archivo llego entero; la
      # atestacion, que salio de aqui y de que commit.
      #
      # Se atesta en este job y no en cada `build` para no dar `id-token` a
      # jobs que ejecutan `npm ci`. La identidad que firma es el workflow y el
      # commit, no el job, asi que la garantia es la misma.
      #
      # GitHub cambia los espacios por puntos al subir un archivo a una
      # release: «Cotejo Setup 0.6.0.exe» se descarga como
      # «Cotejo.Setup.0.6.0.exe». Se renombra aqui primero para que las sumas
      # nombren los archivos como los tiene quien los descarga; si no,
      # `sha256sum -c` no encuentra ninguno.
      - name: Sumas SHA-256
        working-directory: dist
        run: |
          shopt -s nullglob
          for file in *' '*; do mv -- "$file" "${file// /.}"; done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # El cuerpo de la release sale de changelog/, escrito a mano. Debajo,
      # GitHub anade sola la lista de commits y de contribuyentes.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: true
          body_path: changelog/${{ github.ref_name }}.md
          generate_release_notes: true
