# Construye los instalables de las tres plataformas y los publica en la release.
#
# macOS es el motivo de que esto exista: el .dmg no se puede generar desde
# Windows ni desde Linux, hace falta un runner macOS de verdad.
name: release

on:
  push:
    tags:
      - 'v*'
  # Permite probar el workflow sin publicar nada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
            artifacts: |
              release/*.exe
          - os: ubuntu-latest
            script: package:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - os: macos-latest
            script: package:mac
            artifacts: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Empaquetar
        run: npm run ${{ matrix.script }}
        env:
          # Sin certificado electron-builder avisa y sigue sin firmar, que es
          # justo lo que queremos mientras no haya cuenta de Apple Developer.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: cotejo-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
