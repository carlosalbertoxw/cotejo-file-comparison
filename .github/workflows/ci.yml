# Comprobaciones de cada commit y de cada pull request.
#
# El workflow de release solo se dispara con un tag, asi que hasta ahora un
# fallo de tipos o un test roto no aparecia hasta el momento de publicar, que
# es el peor momento posible. Esto lo adelanta a cuando se escribio.
#
# En Windows ademas de en Linux porque Cotejo compara archivos: las rutas, las
# mayusculas del sistema de archivos y los finales de linea se comportan
# distinto, y es justo lo que el proyecto manipula.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitio/**'
      - 'changelog/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'sitio/**'
      - 'changelog/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sin --omit=dev a proposito: Electron, React y CodeMirror estan en
      # devDependencies porque van dentro del bundle, pero son justo lo que se
      # distribuye. Solo en Linux, que la lista de avisos no cambia por sistema.
      - name: Vulnerabilidades conocidas
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Empaquetar entero es cosa del workflow de release; aqui basta con
      # comprobar que los tres bundles se generan, que es donde salen los
      # errores de configuracion que el typecheck no ve.
      - run: npm run build

      # Ubuntu 24.04 prohibe por AppArmor los espacios de nombres de usuario
      # sin privilegios, que es lo que usa el sandbox de Chromium, y Electron
      # se niega a arrancar. Se levanta la restriccion en la maquina de CI en
      # vez de apagar el sandbox, que es justo lo que se quiere probar.
      - name: Permitir el sandbox de Chromium
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # De punta a punta sobre lo que acaba de construir el paso anterior. En
      # Linux no hay pantalla: xvfb-run le presta una virtual.
      - name: Pruebas E2E
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e

      # Si la E2E falla, la captura de la ventana en ese momento suele decir
      # mas que el log.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
